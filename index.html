<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>EduApp — Platform Analytics &amp; Student Tools</title>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('edugrade_theme');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var authUser = localStorage.getItem('edugrade_auth_user');
        if (authUser) {
          window.location.replace('dashboard.html');
        } else {
          window.location.replace('home.html');
        }
      } catch(e) {
        window.location.replace('home.html');
      }
    })();
  </script>
</head>
<body style="background:#0066FF; color:#ffffff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Memuat EduApp...</p>
</body>
</html>
